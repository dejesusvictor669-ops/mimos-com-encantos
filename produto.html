<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Detalhes do Produto — Mimos com Encanto</title>
<meta name="description" content="Conheça detalhes, personalização e o valor dos presentes da Mimos com Encanto.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="container nav">
    <a href="index.html" class="brand">
      <span class="brand-badge"><svg viewBox="0 0 24 24" fill="none" stroke="#B54B5A" stroke-width="1.6"><path d="M12 8c-1.8-3.5-6-3.2-6-.5C6 9.2 8.5 8 12 8Zm0 0c1.8-3.5 6-3.2 6-.5C18 9.2 15.5 8 12 8Z"/><rect x="4" y="8" width="16" height="10" rx="1.5"/><path d="M12 8v10"/></svg></span>
      <span class="brand-name">Mimos <em>com encanto</em><small>Cestas & Presentes</small></span>
    </a>
    <button class="nav-toggle" onclick="toggleMobileNav()" aria-label="Abrir menu"><span></span><span></span><span></span></button>
    <ul class="nav-links">
      <li><a href="index.html">Início</a></li>
      <li><a href="index.html#catalogo" class="active">Catálogo</a></li>
      <li><a href="avaliacoes.html">Avaliações</a></li>
      <li><a href="acompanhar-pedido.html">Acompanhar Pedido</a></li>
    </ul>
    <div class="nav-actions">
      <button class="cart-btn" onclick="abrirCarrinho()" aria-label="Abrir carrinho">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-count">0</span>
      </button>
    </div>
  </nav>
</header>

<main class="section product-detail-page">
  <div class="container">
    <div id="product-detail"></div>
  </div>
</main>

<div id="footer-placeholder"></div>

<div class="cart-overlay" onclick="fecharCarrinho()"></div>
<aside class="cart-drawer">
  <div class="cart-header">
    <h3>Seu carrinho</h3>
    <button class="cart-close" onclick="fecharCarrinho()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total"><span>Total</span><span class="price" id="cart-total-value">R$ 0,00</span></div>
    <form id="checkout-form" onsubmit="finalizarPedido(event)">
      <div class="cart-form-row"><label for="checkout-nome">Seu nome</label><input type="text" id="checkout-nome" required></div>
      <div class="cart-form-row"><label for="checkout-telefone">WhatsApp para contato</label><input type="tel" id="checkout-telefone" required></div>
      <div class="cart-form-row"><label for="checkout-entrega">Forma de entrega</label><select id="checkout-entrega"><option value="entrega">Entrega em casa (+ R$ 15,00)</option><option value="retirada">Retirar na loja</option></select></div>
      <div class="cart-form-row"><label for="checkout-pagamento">Forma de pagamento</label><select id="checkout-pagamento"><option value="pix">Pix</option><option value="transferencia">Transferência</option><option value="dinheiro">Dinheiro</option></select></div>
      <div class="cart-form-row"><label for="checkout-obs">Observações (opcional)</label><textarea id="checkout-obs" rows="2"></textarea></div>
      <div class="cart-summary"><div><span>Subtotal</span><strong id="checkout-subtotal">R$ 0,00</strong></div><div><span>Entrega</span><strong id="checkout-entrega-valor">R$ 15,00</strong></div><div class="total"><span>Total</span><strong id="checkout-total">R$ 0,00</strong></div></div>
      <button type="submit" id="btn-finalizar" class="btn btn-primary btn-block">Finalizar pedido no WhatsApp</button>
    </form>
  </div>
</aside>

<a class="whatsapp-float" id="whatsapp-float" href="#" target="_blank" rel="noopener" aria-label="Fale conosco no WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.6-.8-1.9-.9-.2-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.4.1-.6l.4-.5c.1-.1.2-.3.2-.4.1-.2 0-.3 0-.5-.1-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3 4.8 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.6-.7 1.9-1.3.2-.6.2-1.1.2-1.3-.1-.1-.3-.2-.6-.3Z"/><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm0 18.2c-1.6 0-3.1-.4-4.5-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2Z"/></svg>
</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
<script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/cart.js"></script>
<script src="js/footer.js"></script>
<script src="js/produto.js"></script>
<script>
  document.getElementById('whatsapp-float').href = linkWhatsapp('Olá! Vim pelo site e gostaria de saber mais sobre os presentes da Mimos com Encanto 🎁');
</script>
</body>
</html>
